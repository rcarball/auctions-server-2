spring.application.name=auctions-server-2
spring.output.ansi.enabled=ALWAYS

server.port=8082

# Project persistence: database location.
# "file:" stores data on disk; "mem:" loses it when the process terminates.
# The path ./data/auctionsdb is relative to the application's working directory:
# always use the same working directory to open the same database.
spring.datasource.url=jdbc:h2:file:./data/auctionsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=db-user
spring.datasource.password=db-password

spring.sql.init.platform=h2

# Enable H2 console in the browser
spring.h2.console.enabled=true

# Project persistence: schema management (independent of the database URL).
# "update" preserves data and adjusts the schema to the entities where possible;
# it cannot handle every model change or prevent duplicate insertions.
# "create-drop" recreates tables at startup and drops them at shutdown:
# data is lost between runs EVEN when using a "file:" database.
# Reserve it for tests or demonstrations using a separate database.
# For a primary key conflict, check identifiers and the initial data load;
# switching to "mem:" or "create-drop" may hide the problem without fixing it.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Manual persistence check (no automated tests required):
# create, update and delete records; stop and restart the application.
# Verify that changes persist and that the initial data load is not duplicated.

# External currency conversion service (FreeCurrencyAPI).
# The key is intentionally absent from source control. When it is not configured,
# CurrencyService uses its local EUR/USD/GBP fallback rates.
currency.api.url=${CURRENCY_API_URL:https://api.freecurrencyapi.com/v1/latest}
currency.api.key=${CURRENCY_API_KEY:}

# Logging message pattern
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%-35.35logger{0}){cyan} : %msg%n
